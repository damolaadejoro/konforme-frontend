stages:
  - test
  - build
  - deploy

frontend-test:
  stage: test
  image: node:20-alpine
  before_script:
    - npm ci
  script:
    - npx vitest --run
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "main"

frontend-build:
  stage: build
  image: node:20-alpine
  before_script:
    - npm ci
  script:
    - VITE_API_URL=${VITE_API_URL} VITE_EMAIL_ENABLED=${VITE_EMAIL_ENABLED} npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

frontend-deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$EC2_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  script:
    - rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" dist/ "$EC2_USER@$EC2_HOST:/var/www/konforme-frontend/"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
